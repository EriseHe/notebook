name: Check E.H. Notebook

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-checks-${{ github.event_name == 'pull_request' && github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run format:check
      - run: npm test
      # The browser suite builds the complete site and checks its links, math,
      # navigation, and responsive layout. Publication is performed locally.
      - run: npm run test:browser
      - name: Keep browser screenshots and compatibility report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notebook-checks
          path: |
            .preview-artifacts/
            .quiet-reader/build-report.json
          include-hidden-files: true
          retention-days: 7
