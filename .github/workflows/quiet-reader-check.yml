name: Validate Quiet Reader (no deployment)

on:
  push:
    branches: ['codex/quiet-reader']
  pull_request:
    paths:
      - 'site/**'
      - 'content/**'
      - 'filters/**'
      - 'package*.json'
      - '.github/workflows/quiet-reader-check.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run format:check
      - run: npm test
      - run: npm run test:browser
      - name: Keep preview build for review (not GitHub Pages)
        uses: actions/upload-artifact@v4
        with:
          name: quiet-reader-preview
          path: .quiet-reader/dist
          include-hidden-files: true
      - name: Keep browser screenshots and compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-reader-checks
          path: |
            .preview-artifacts/
            .quiet-reader/build-report.json
